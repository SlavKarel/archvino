id: about
title:
  ru: О студии
  en: About
biography:
  ru: Archvino ведет частные дома, интерьеры и камерные общественные пространства от первой идеи до сопровождения реализации.
  en: Archvino leads private homes, interiors, and intimate public spaces from the first concept through delivery support.
approach:
  ru: В основе подхода спокойная композиция, точная работа со светом и материалами и внимательное отношение к повседневным сценариям заказчика.
  en: The approach is rooted in calm composition, careful work with light and materials, and close attention to the client’s daily routines.
credentials:
  ru: "Практика базируется в Москве, работает по России и сопровождает проект на всех ключевых этапах: от концепции до стройки."
  en: The practice is based in Moscow, works across Russia, and stays involved through the key stages from concept to construction.
