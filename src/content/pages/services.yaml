id: services
title:
  ru: Услуги
  en: Services
intro:
  ru: Мы подключаемся на той стадии, где проекту нужна ясная архитектурная логика, спокойная координация и внимание к реализации.
  en: We join at the stage where a project needs clear architectural logic, calm coordination, and close attention to delivery.
items:
  - ru: Архитектурная концепция, планировочные сценарии и объемное решение
    en: Architectural concept, planning scenarios, and spatial massing
  - ru: Интерьер, материаловая палитра и деталировка ключевых узлов
    en: Interior design, material palette, and detailing of key junctions
  - ru: Координация смежных разделов и уточнение проектных решений
    en: Coordination across disciplines and refinement of project decisions
  - ru: Авторское сопровождение реализации и регулярные выезды на объект
    en: Construction supervision and regular site visits during delivery
cta:
  ru: Если у вас есть участок, помещение или проект в развитии, напишите нам, и мы предложим подходящий формат работы.
  en: If you have a site, interior, or project already in progress, write to us and we will suggest the right scope of work.
