      ru: Идея
      en: Idea
    heading:
      ru: Дом работает как последовательность тихих сцен.
      en: The building works as a sequence of quiet scenes.
    body:
      ru: Маршрут выстроен так, чтобы чередовать открытые и камерные пространства без резких смен масштаба.
      en: The route alternates open and intimate spaces without abrupt changes in scale.
