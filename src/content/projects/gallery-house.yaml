      ru: Материалы
      en: Materials
    heading:
      ru: Палитра сведена к светлой штукатурке, дубу и бетону.
      en: The palette is reduced to pale plaster, oak, and concrete.
    body:
      ru: Сдержанная палитра позволяет искусству оставаться главным визуальным акцентом интерьера.
      en: The restrained palette allows the art to remain the main visual focus inside.
