sections:
  - label: { ru: Контекст, en: Context }
    heading: { ru: Продолжение улицы, en: A continuation of the street }
    body:
      ru: Пропорции, членения и материал фасада поддерживают сложившийся масштаб окружения. Архитектура остается заметной, но не спорит с исторической застройкой.
      en: The proportions, articulation, and facade material respond to the established scale. The architecture has a clear presence without competing with its historic surroundings.
  - label: { ru: Фасад, en: Facade }
    heading: { ru: Ритм света и глубины, en: A rhythm of light and depth }
    body:
      ru: Выступающие плоскости, глубокие проемы и сдержанная палитра собирают фасад в цельную спокойную композицию.
      en: Projecting planes, deep openings, and a restrained palette form a calm and coherent composition.
